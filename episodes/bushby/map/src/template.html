<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
__STYLE__

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="旅程轨迹地球图，可拖动旋转、滚轮缩放"></canvas>
    <div class="hud">
      <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div>
      <div class="ticker" aria-live="polite"><b id="tDate"></b><span id="tPlace"></span><span class="stall" id="tStall"></span></div>
    </div>
    <div class="ctrl">
      <button id="play" type="button">▶ 按日期播放</button>
      <button id="speed" type="button" title="播放速度">1×</button>
      <input id="scrub" class="scrub" type="range" min="0" max="1000" value="1000" aria-label="时间轴">
      <button id="spin" type="button" aria-pressed="false">自转</button>
      <button id="labels" type="button" aria-pressed="true">地名</button>
      <button id="voidfade" type="button" aria-pressed="true">作废段变灰</button>
    </div>
  </div>
  <aside class="rail">
    <div class="label">关键路段 · 点击放大</div>
    <div class="cases" id="cases"></div>
    <div class="note" id="note"></div>
    <div class="legend" aria-label="图例">
      <span class="sw" style="border-color:var(--route)"></span><span>步行（实线有据 · 虚线推断）</span>
      <span class="sw" style="border-color:var(--swim);border-top-style:dashed"></span><span>游泳</span>
      <span class="sw" style="border-color:var(--move);border-top-style:dotted"></span><span>交通工具，离线或归位（不推进）</span>
      <span class="sw" style="border-color:var(--back);border-top-style:dotted"></span><span>交通工具，往前押送（已重走）/ 往后送</span>
      <span class="sw" style="border-color:var(--void);border-top-style:dashed"></span><span>作废段（被新线替换）</span>
      <span class="sw" style="border-color:var(--protest)"></span><span>抗议步行（不计入环球路线）</span>
      <span style="font-size:15px;text-align:center;color:var(--ink)">◆</span><span>事件标记（放大时显示）</span>
    </div>
    <div class="foot" id="foot"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const D=__DATA__;
const TOPO=__TOPO__;
const RIVERS=__RIVERS__;
const CFG=D.config;

// ---------- time ----------
const DAY=86400000;
const day2date=d=>new Date(d*DAY);
const fmt=d=>day2date(d).toISOString().slice(0,10);
const pts=D.points;                       // each: name, lon, lat, date, status, leg, t (arrival day), dep (departure day of the leg into it)
const T0=pts[0].t, T1=pts[pts.length-1].t;
let T=T1;                                  // current calendar day
let playing=false, speed=1, showLabels=true, activeCase="all", voidFade=1;

// ---------- colours ----------
const css=getComputedStyle(document.documentElement);
let C={};
function readColors(){["ocean","land","border","grat","route","route-soft","swim","move","back","void","protest","ink","muted","paper"].forEach(k=>C[k]=css.getPropertyValue("--"+k).trim());}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{readColors();draw();});
new MutationObserver(()=>{readColors();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

// ---------- geography ----------
const land=topojson.feature(TOPO,TOPO.objects.countries);
const borders=topojson.mesh(TOPO,TOPO.objects.countries,(a,b)=>a!==b);
const grat=d3.geoGraticule10();
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const proj=d3.geoOrthographic().clipAngle(90).precision(0.3);
const path=d3.geoPath(proj,ctx);
let W=0,H=0,state={rot:[60,-20,0],r:90};
const line=c=>({type:"LineString",coordinates:c});
function scaleFor(r){const half=Math.min(W,H)/2*0.9;return r>=89?half:half/Math.sin(r*Math.PI/180);}
function resize(){const b=cv.parentElement.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function visible(lon,lat){const r=proj.rotate();return d3.geoDistance([lon,lat],[-r[0],-r[1]])<Math.PI/2-0.01;}
const frac=(a,b)=>b<=a?(T>=b?1:0):Math.max(0,Math.min(1,(T-a)/(b-a)));
function partial(coords,f){ // first fraction f of a polyline, along its length
  if(f>=1)return coords;if(f<=0)return [coords[0]];
  const seg=[];let tot=0;for(let i=1;i<coords.length;i++){const d=d3.geoDistance(coords[i-1],coords[i]);seg.push(d);tot+=d;}
  let need=f*tot,out=[coords[0]];for(let i=1;i<coords.length;i++){if(need>=seg[i-1]){out.push(coords[i]);need-=seg[i-1];}else{out.push(d3.geoInterpolate(coords[i-1],coords[i])(seg[i-1]?need/seg[i-1]:0));break;}}
  return out;}

// ---------- state helpers ----------
function frontier(){ // index of last arrived point, and current position
  let i=0;while(i+1<pts.length&&pts[i+1].t<=T)i++;
  const n=pts[i+1];
  if(n&&n.leg!=="start"&&T>n.dep){const f=(T-n.dep)/(n.t-n.dep);return{i,pos:d3.geoInterpolate([pts[i].lon,pts[i].lat],[n.lon,n.lat])(f),moving:n.leg};}
  const v=D.voided; // a leg walked after the last route point and later replaced
  if(T>=v.lo&&T<v.voided_on&&pts[i].t<=v.lo){const vp=partial(v.path,frac(v.lo,v.hi));return{i,pos:vp[vp.length-1],moving:T<v.hi?"walk":null,place:T>=v.hi?v.end_label:null};}
  return{i,pos:[pts[i].lon,pts[i].lat],moving:null};}
function lastMoveEnd(){let e=T0;if(T>=D.voided.lo)e=Math.max(e,Math.min(T,D.voided.hi));for(let i=1;i<pts.length;i++){const p=pts[i];if(p.leg==="start")continue;if(p.dep<=T)e=Math.max(e,Math.min(T,p.t));}return e;}
function activeMove(){return D.moves.find(m=>T>=m.lo&&T<=m.hi);}

// ---------- draw ----------
function draw(){
  if(!W)return;
  proj.translate([W/2,H/2+(W<520?20:10)]).scale(scaleFor(state.r)).rotate(state.rot);
  const zoom=scaleFor(state.r)/scaleFor(90);
  ctx.clearRect(0,0,W,H);
  ctx.setLineDash([]);
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=C.ocean;ctx.fill();
  ctx.beginPath();path(grat);ctx.strokeStyle=C.grat;ctx.lineWidth=0.6;ctx.stroke();
  ctx.beginPath();path(land);ctx.fillStyle=C.land;ctx.fill();
  ctx.beginPath();path(borders);ctx.strokeStyle=C.border;ctx.lineWidth=zoom>6?0.9:0.5;ctx.stroke();
  if(zoom>3){ctx.beginPath();path(RIVERS);ctx.strokeStyle=C.swim;ctx.globalAlpha=.5;ctx.lineWidth=zoom>20?1.6:1;ctx.stroke();ctx.globalAlpha=1;}
  ctx.beginPath();path({type:"Sphere"});ctx.strokeStyle=C.border;ctx.lineWidth=1;ctx.stroke();
  const lw=Math.min(4,2+Math.log2(zoom)*0.4);

  // protest walk (separate, not counted)
  const pr=D.protest.points;for(let i=1;i<pr.length;i++){const f=frac(pr[i-1].t,pr[i].t);if(f<=0)continue;
    ctx.beginPath();path(line(partial([[pr[i-1].lon,pr[i-1].lat],[pr[i].lon,pr[i].lat]],f)));ctx.strokeStyle=C.protest;ctx.lineWidth=lw*0.6;ctx.stroke();}

  // voided leg: drawn in route colour during its window, then turns grey once replaced
  const v=D.voided,vf=frac(v.lo,v.hi);
  if(vf>0){const grey=T>=v.voided_on?voidFade:0;ctx.setLineDash(grey>0.5?[6,5]:[]);ctx.beginPath();path(line(partial(v.path,vf)));
    ctx.strokeStyle=d3.interpolateRgb(C.route,C.void)(grey);ctx.lineWidth=lw*(grey>0.5?0.7:1);ctx.stroke();ctx.setLineDash([]);}

  // main route, by date
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(b.leg==="start")continue;
    const f=frac(b.dep,b.t);if(f<=0)continue;
    const inferred=a.status==="inferred"||b.status==="inferred";
    ctx.beginPath();path(line(partial([[a.lon,a.lat],[b.lon,b.lat]],f)));
    if(b.leg==="swim"){ctx.setLineDash([5,4]);ctx.strokeStyle=C.swim;ctx.lineWidth=lw;}
    else if(b.leg==="gap"){ctx.setLineDash([2,6]);ctx.strokeStyle=C["route-soft"];ctx.lineWidth=lw*0.8;}
    else{ctx.setLineDash(inferred?[7,4]:[]);ctx.strokeStyle=inferred?C["route-soft"]:C.route;ctx.lineWidth=lw;}
    ctx.stroke();}
  ctx.setLineDash([]);

  // transport moves (never part of the route line)
  D.moves.filter(m=>activeCase==="all"||playing||m.case===activeCase).forEach(m=>{const f=frac(m.lo,m.hi);if(f<=0)return;
    const col=(m.type==="back"||m.type==="fwd_rewalked")?C.back:C.move;
    ctx.setLineDash([1.5,4]);ctx.lineCap="round";ctx.beginPath();path(line(partial(m.path,f)));ctx.strokeStyle=col;ctx.lineWidth=lw*0.8;ctx.stroke();ctx.lineCap="butt";ctx.setLineDash([]);
    if(f>=1)arrowAt(m.path,col);});

  // points
  const fr=frontier(),shown=[],dot=zoom>8?3.6:zoom>2?2.6:1.6;
  for(let i=0;i<=fr.i;i++){const p=pts[i];if(!visible(p.lon,p.lat))continue;const xy=proj([p.lon,p.lat]);
    ctx.beginPath();ctx.arc(xy[0],xy[1],dot,0,7);ctx.fillStyle=p.status==="inferred"?C.paper:C.route;ctx.fill();ctx.strokeStyle=C.route;ctx.lineWidth=1.2;ctx.stroke();shown.push([p.name,p.date,p.status,xy]);}
  // reference places and dated events
  (CFG.refs[activeCase]||[]).forEach(r=>{if(!visible(r.lon,r.lat))return;const xy=proj([r.lon,r.lat]);ctx.beginPath();ctx.rect(xy[0]-3.5,xy[1]-3.5,7,7);ctx.fillStyle=C.paper;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.stroke();shown.push([r.label,"","ref",xy]);});
  if(zoom>2.2)D.events.forEach(e=>{if(T<e.t||!visible(e.lon,e.lat))return;const xy=proj([e.lon,e.lat]);ctx.beginPath();ctx.moveTo(xy[0],xy[1]-5);ctx.lineTo(xy[0]+5,xy[1]);ctx.lineTo(xy[0],xy[1]+5);ctx.lineTo(xy[0]-5,xy[1]);ctx.closePath();
    ctx.fillStyle=e.status==="inferred"?C.paper:C.ink;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.stroke();shown.unshift([e.label,e.date,e.status==="inferred"?"inferred":"event",xy]);});
  // frontier ring
  if(T<T1&&visible(fr.pos[0],fr.pos[1])){const xy=proj(fr.pos);ctx.beginPath();ctx.arc(xy[0],xy[1],7,0,7);ctx.strokeStyle=C.route;ctx.lineWidth=2;ctx.stroke();}
  // labels
  if(showLabels&&zoom>2.2){ctx.font=`500 ${zoom>8?13:12}px ${css.getPropertyValue("--body")}`;ctx.textBaseline="middle";const boxes=[];
    shown.forEach(([n,d,s,xy])=>{const txt=n+(zoom>8&&d?"  "+d:"");const w=ctx.measureText(txt).width;const bx=[xy[0]+8,xy[1]-8,w+6,16];
      if(bx[0]+bx[2]>W-4||bx[1]<64||bx[1]>H-56)return;if(boxes.some(b=>!(bx[0]>b[0]+b[2]||bx[0]+bx[2]<b[0]||bx[1]>b[1]+b[3]||bx[1]+bx[3]<b[1])))return;boxes.push(bx);
      ctx.fillStyle=C.paper;ctx.globalAlpha=.85;ctx.fillRect(bx[0],bx[1],bx[2],bx[3]);ctx.globalAlpha=1;ctx.fillStyle=s==="inferred"?C.muted:C.ink;ctx.fillText(txt,bx[0]+3,xy[1]);});}
  updateTicker(fr);
}
function arrowAt(cs,col){const a=cs[cs.length-2],b=cs[cs.length-1];if(!visible(b[0],b[1]))return;const A=proj(d3.geoInterpolate(a,b)(0.92)),B=proj(b);if(!A||!B)return;
  const ang=Math.atan2(B[1]-A[1],B[0]-A[0]);ctx.beginPath();ctx.moveTo(B[0],B[1]);ctx.lineTo(B[0]-9*Math.cos(ang-0.45),B[1]-9*Math.sin(ang-0.45));ctx.lineTo(B[0]-9*Math.cos(ang+0.45),B[1]-9*Math.sin(ang+0.45));ctx.closePath();ctx.fillStyle=col;ctx.fill();}

// ---------- ticker: the calendar keeps running while the line stops ----------
const tDate=document.getElementById("tDate"),tPlace=document.getElementById("tPlace"),tStall=document.getElementById("tStall"),scrub=document.getElementById("scrub");
function updateTicker(fr){
  tDate.textContent=fmt(Math.round(T));tPlace.textContent=fr.place||pts[fr.i].name;
  const mv=activeMove();
  let msg="",on=false;
  if(fr.moving)msg=fr.moving==="swim"?"游泳中":"行走中";
  else if(mv)msg="交通工具：线不动（"+(mv.type==="back"?"往后送":mv.type==="fwd_rewalked"?"往前押送，之后重走":"离线/归位")+"）";
  if(!fr.moving&&T<T1){const s=Math.floor(T-lastMoveEnd());if(s>=30){msg=(msg?msg+" · ":"")+"线已停 "+s.toLocaleString()+" 天";on=s>=180;}}
  tStall.textContent=msg;tStall.className="stall"+(on?" on":"");
  if(document.activeElement!==scrub)scrub.value=Math.round((T-T0)/(T1-T0)*1000);
}

// ---------- camera ----------
let anim=null;
function stopAnim(){if(anim){anim.stop();anim=null;}}
function flyTo(c,r,ms=1800){stopAnim();const r0=state.rot.slice(),rr0=state.r;
  const iC=d3.geoInterpolate([-r0[0],-r0[1]],c);const lz0=Math.log(scaleFor(rr0)),lz1=Math.log(scaleFor(r));
  const peak=Math.min(lz0,lz1)-Math.min(0.8,Math.abs(lz1-lz0)*0.3+d3.geoDistance([-r0[0],-r0[1]],c)*0.5);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)ms=1;
  anim=d3.timer(el=>{const t=Math.min(1,el/ms),e=d3.easeCubicInOut(t);const cc=iC(e);state.rot=[-cc[0],-cc[1],0];
    const lz=(1-e)*(1-e)*lz0+2*e*(1-e)*peak+e*e*lz1;const half=Math.min(W,H)/2*0.9;const s=Math.exp(lz);state.r=s<=half?90:Math.asin(Math.min(1,half/s))*180/Math.PI;
    draw();if(t>=1){stopAnim();state.rot=[-c[0],-c[1],0];state.r=r;draw();}});}
d3.select(cv).call(d3.drag().on("start",()=>{stopAnim();spin(false);}).on("drag",ev=>{const k=75/proj.scale();state.rot=[state.rot[0]+ev.dx*k,Math.max(-89,Math.min(89,state.rot[1]-ev.dy*k)),0];draw();}));
cv.addEventListener("wheel",ev=>{ev.preventDefault();stopAnim();const s=scaleFor(state.r)*Math.exp(-ev.deltaY*0.0015);const half=Math.min(W,H)/2*0.9;state.r=s<=half?90:Math.max(0.3,Math.asin(Math.min(1,half/s))*180/Math.PI);draw();},{passive:false});

// ---------- cases ----------
const casesEl=document.getElementById("cases"),noteEl=document.getElementById("note");
CFG.cases.forEach(cs=>{const b=document.createElement("button");b.type="button";b.className="case";b.id="case-"+cs.id;b.setAttribute("aria-pressed","false");
  const k=document.createElement("span");k.className="k";k.textContent=cs.tag;const t=document.createElement("span");t.className="t";t.textContent=cs.title;b.append(k,t);
  b.onclick=()=>select(cs.id,true);casesEl.appendChild(b);});
function select(id,fly){activeCase=id;const cs=CFG.cases.find(c=>c.id===id);
  document.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",b.id==="case-"+id?"true":"false"));
  noteEl.innerHTML="";const l=document.createElement("div");l.className="label";l.textContent="对应分集节拍 "+cs.beats;const h=document.createElement("h2");h.textContent=cs.title;
  const p=document.createElement("p");p.textContent=cs.text;const f=document.createElement("div");f.className="facts";f.textContent=cs.facts;noteEl.append(l,h,p,f);
  pause();spin(false);T=T1;if(fly)flyTo(cs.center,cs.radius);else{state.rot=[-cs.center[0],-cs.center[1],0];state.r=cs.radius;draw();}
  if(location.hash.slice(1)!==id){try{history.replaceState(null,"","#"+id);}catch(e){}}}

// ---------- playback by date ----------
const playBtn=document.getElementById("play"),speedBtn=document.getElementById("speed");
const BASE_MS=64000; // whole 28 years at 1×
let clock=null;
function pause(){if(clock){clock.stop();clock=null;}playing=false;playBtn.textContent="▶ 按日期播放";}
function play(){stopAnim();spin(false);if(T>=T1-1)T=T0;if(activeCase!=="all"){activeCase="all";document.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",b.id==="case-all"?"true":"false"));}
  playing=true;playBtn.textContent="❚❚ 暂停";if(state.r>70)state.r=60;let last=performance.now();
  clock=d3.timer(()=>{const now=performance.now(),dt=now-last;last=now;T=Math.min(T1,T+dt/BASE_MS*speed*(T1-T0));
    const fr=frontier();const cur=[-state.rot[0],-state.rot[1]];const tgt=[fr.pos[0],Math.max(-45,Math.min(60,fr.pos[1]))];
    const c=d3.geoInterpolate(cur,tgt)(Math.min(1,dt/900));state.rot=[-c[0],-c[1],0];draw();if(T>=T1)pause();});}
playBtn.onclick=()=>playing?pause():play();
speedBtn.onclick=()=>{speed=speed===1?2:speed===2?0.5:1;speedBtn.textContent=speed+"×";};
scrub.addEventListener("input",()=>{pause();T=T0+(+scrub.value/1000)*(T1-T0);draw();});
let spinT=null;function spin(on){const b=document.getElementById("spin");if(on===undefined)on=!spinT;b.setAttribute("aria-pressed",on?"true":"false");
  if(spinT){spinT.stop();spinT=null;}if(on){stopAnim();spinT=d3.timer(()=>{state.rot=[state.rot[0]+0.12,state.rot[1],0];draw();});}}
document.getElementById("spin").onclick=()=>spin();
document.getElementById("labels").onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute("aria-pressed",showLabels);draw();};
let voidT=null;
document.getElementById("voidfade").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);
  const from=voidFade,to=on?1:0;if(voidT)voidT.stop();const t0=performance.now();const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  voidT=d3.timer(()=>{const t=reduce?1:Math.min(1,(performance.now()-t0)/1400);voidFade=from+(to-from)*d3.easeCubicInOut(t);draw();if(t>=1){voidT.stop();voidT=null;}});};

// ---------- boot ----------
document.getElementById("hTitle").textContent=CFG.title;document.getElementById("hSub").textContent=CFG.subtitle;document.getElementById("foot").textContent=CFG.footnote;
window.addEventListener("resize",resize);
resize();
const start=location.hash.slice(1);select(CFG.cases.some(c=>c.id===start)?start:"all",false);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(CFG.cases.some(c=>c.id===h)&&h!==activeCase)select(h,true);});
</script>
