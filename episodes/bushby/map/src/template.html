<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
__STYLE__
<style>
#globe{position:absolute;inset:0;cursor:grab}
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.stage::before{top:0;height:120px;background:linear-gradient(rgba(3,7,12,.72),rgba(3,7,12,0))}
.stage::after{bottom:0;height:90px;background:linear-gradient(rgba(3,7,12,0),rgba(3,7,12,.66))}
#globe:active{cursor:grabbing}
.hud,.ctrl{z-index:2}
.gl-label{font:500 12px var(--body);color:#f1f5f3;background:rgba(4,10,16,.72);border:1px solid rgba(255,255,255,.12);padding:1px 7px;border-radius:9px;white-space:nowrap;transform:translate(10px,-50%);pointer-events:none}
.gl-label.inf{color:#a9b9b5}
.gl-label.ref{border-style:dashed}
.gl-ev{position:relative;pointer-events:none}
.gl-ev i{position:absolute;left:-6px;top:-6px;width:10px;height:10px;transform:rotate(45deg);background:#f4efe6;box-shadow:0 0 10px 3px rgba(255,236,214,.55)}
.gl-ev.inf i{background:transparent;border:1.5px solid #f4efe6}
.gl-ev .gl-label{position:absolute;left:4px;top:0}
.gl-head{position:relative;pointer-events:none}
.gl-head i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#fff3e6;box-shadow:0 0 12px 5px rgba(255,150,70,.85),0 0 32px 12px rgba(255,110,30,.45)}
.gl-head.wait i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 6px 2px rgba(255,150,70,.6),0 0 46px 20px rgba(255,110,30,.25)}}
@media (prefers-reduced-motion: reduce){.gl-head.wait i{animation:none}}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <div id="globe" aria-label="旅程轨迹三维地球，可拖动旋转、滚轮缩放"></div>
    <div class="hud">
      <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div>
      <div class="ticker" aria-live="polite"><b id="tDate"></b><span id="tPlace"></span><span class="stall" id="tStall"></span></div>
    </div>
    <div class="ctrl">
      <button id="play" type="button">▶ 按日期播放</button>
      <button id="speed" type="button" title="播放速度">1×</button>
      <input id="scrub" class="scrub" type="range" min="0" max="1000" value="1000" aria-label="时间轴">
      <button id="spin" type="button" aria-pressed="false">自转</button>
      <button id="labels" type="button" aria-pressed="true">地名</button>
      <button id="voidfade" type="button" aria-pressed="true">作废段变灰</button>
    </div>
  </div>
  <aside class="rail">
    <div class="stats" id="stats"></div>
    <div class="stripe-wrap">
      <div class="label">28 年里，哪些月份在走</div>
      <div class="stripe" id="stripe" role="slider" aria-label="时间条：点击跳到该日期" tabindex="0"><canvas id="stripeCv"></canvas><div class="now" id="stripeNow"></div></div>
      <div class="stripe-axis"><span>1998</span><span>2006</span><span>2014</span><span>2019</span><span>2026</span></div>
      <div class="stripe-key" id="stripeKey"></div>
    </div>
    <div id="groups"></div>
    <div class="note" id="note"></div>
    <div class="legend" aria-label="图例" id="legend"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.4/dist/globe.gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const D=__DATA__;
const TOPO=__TOPO__;
const EARTH="__EARTH__";
const CFG=D.config;

// ---------- time ----------
const DAY=86400000,fmt=d=>new Date(d*DAY).toISOString().slice(0,10);
const pts=D.points,T0=pts[0].t,T1=pts[pts.length-1].t;
let T=T1,playing=false,speed=1,showLabels=true,activeCase="all",voidFade=1;
const frac=(a,b)=>b<=a?(T>=b?1:0):Math.max(0,Math.min(1,(T-a)/(b-a)));
const COL={swim:"#00b4d8",move:"#8e6cf0",back:"#e5386d",void:"#7d8784",protest:"rgba(40,44,52,.55)",casing:"rgba(24,16,10,.32)"};
const EPS=CFG.episodes.map(e=>({...e,lo:Date.parse(e.from)/DAY,hi:Date.parse(e.to)/DAY}));
const ROUTE="#ff7a1a";const epOf=t=>({id:"x",color:ROUTE});
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};

// ---------- smooth route: centripetal Catmull-Rom on the sphere ----------
const toV=([lo,la])=>{const l=lo*Math.PI/180,p=la*Math.PI/180;return[Math.cos(p)*Math.cos(l),Math.cos(p)*Math.sin(l),Math.sin(p)];};
const toLL=v=>{const n=Math.hypot(...v);return[Math.atan2(v[1],v[0])*180/Math.PI,Math.asin(v[2]/n)*180/Math.PI];};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
function cr(P0,P1,P2,P3,n){const tj=(a,b)=>Math.pow(Math.max(1e-6,Math.hypot(...sub(b,a))),0.5);
  const t0=0,t1=t0+tj(P0,P1),t2=t1+tj(P1,P2),t3=t2+tj(P2,P3);const out=[];
  for(let k=0;k<=n;k++){const t=t1+(t2-t1)*k/n;
    const A1=add(mul(P0,(t1-t)/(t1-t0)),mul(P1,(t-t0)/(t1-t0))),A2=add(mul(P1,(t2-t)/(t2-t1)),mul(P2,(t-t1)/(t2-t1))),A3=add(mul(P2,(t3-t)/(t3-t2)),mul(P3,(t-t2)/(t3-t2)));
    const B1=add(mul(A1,(t2-t)/(t2-t0)),mul(A2,(t-t0)/(t2-t0))),B2=add(mul(A2,(t3-t)/(t3-t1)),mul(A3,(t-t1)/(t3-t1)));
    out.push(toLL(add(mul(B1,(t2-t)/(t2-t1)),mul(B2,(t-t1)/(t2-t1)))));}
  return out;}
const LEG=pts.map((b,i)=>{if(i===0||b.leg==="start")return null;const a=pts[i-1];
  const prev=(a.leg==="start"||i<2)?a:pts[i-2];const next=(pts[i+1]&&pts[i+1].leg!=="start")?pts[i+1]:b;
  const ang=d3.geoDistance([a.lon,a.lat],[b.lon,b.lat])*180/Math.PI;const n=Math.max(2,Math.min(48,Math.ceil(ang/0.3)));
  const P1=toV([a.lon,a.lat]),P2=toV([b.lon,b.lat]);
  const P0=prev===a?sub(mul(P1,2),P2):toV([prev.lon,prev.lat]),P3=next===b?sub(mul(P2,2),P1):toV([next.lon,next.lat]);
  return cr(P0,P1,P2,P3,n);});
function cut(c,f){if(f>=1)return c;const x=(c.length-1)*Math.max(0,f),i=Math.floor(x);const out=c.slice(0,i+1);if(i+1<c.length)out.push(d3.geoInterpolate(c[i],c[i+1])(x-i));return out;}
function partial(coords,f){if(f>=1)return coords;if(f<=0)return [coords[0]];
  const seg=[];let tot=0;for(let i=1;i<coords.length;i++){const d=d3.geoDistance(coords[i-1],coords[i]);seg.push(d);tot+=d;}
  let need=f*tot,out=[coords[0]];for(let i=1;i<coords.length;i++){if(need>=seg[i-1]){out.push(coords[i]);need-=seg[i-1];}else{out.push(d3.geoInterpolate(coords[i-1],coords[i])(seg[i-1]?need/seg[i-1]:0));break;}}
  return out;}
const dens=c=>{const o=[c[0]];for(let i=1;i<c.length;i++){const n=Math.max(1,Math.ceil(d3.geoDistance(c[i-1],c[i])*180/Math.PI/1.5)),I=d3.geoInterpolate(c[i-1],c[i]);for(let k=1;k<=n;k++)o.push(I(k/n));}return o;};

// ---------- state helpers ----------
function frontier(){
  let i=0;while(i+1<pts.length&&pts[i+1].t<=T)i++;
  const n=pts[i+1];
  if(n&&n.leg!=="start"&&T>n.dep){const c=cut(LEG[i+1],(T-n.dep)/(n.t-n.dep));return{i,pos:c[c.length-1],moving:n.leg};}
  const v=D.voided;
  if(T>=v.lo&&T<v.voided_on&&pts[i].t<=v.lo){const vp=partial(v.path,frac(v.lo,v.hi));return{i,pos:vp[vp.length-1],moving:T<v.hi?"walk":null,place:T>=v.hi?v.end_label:null};}
  return{i,pos:[pts[i].lon,pts[i].lat],moving:null};}
function lastMoveEnd(){let e=T0;if(T>=D.voided.lo)e=Math.max(e,Math.min(T,D.voided.hi));for(let i=1;i<pts.length;i++){const p=pts[i];if(p.leg==="start")continue;if(p.dep<=T)e=Math.max(e,Math.min(T,p.t));}return e;}
const activeMove=()=>D.moves.find(m=>T>=m.lo&&T<=m.hi);

// ---------- globe ----------
const el=document.getElementById("globe");
const coast50=topojson.mesh(TOPO,TOPO.objects.countries);
const G=Globe({animateIn:false})(el)
  .globeImageUrl(EARTH).backgroundColor("rgba(0,0,0,0)")
  .showAtmosphere(true).atmosphereColor("#9fd3ff").atmosphereAltitude(0.16)
  .pathPoints("c").pathPointLat(p=>p[1]).pathPointLng(p=>p[0]).pathPointAlt(p=>p[2]===undefined?0.0012:p[2])
  .pathColor("col").pathStroke("w").pathTransitionDuration(0).pathDashLength(d=>d.dash?d.dash[0]:1).pathDashGap(d=>d.dash?d.dash[1]:0)
  .arcStartLat(d=>d.a[1]).arcStartLng(d=>d.a[0]).arcEndLat(d=>d.b[1]).arcEndLng(d=>d.b[0])
  .arcColor(d=>[d.col.slice(0,7)+"22",d.col]).arcStroke(d=>d.w).arcAltitudeAutoScale(0.38).arcDashLength(0.5).arcDashGap(0.12).arcDashAnimateTime(2600).arcsTransitionDuration(0)
  .htmlLat(d=>d.lat).htmlLng(d=>d.lon).htmlAltitude(d=>d.alt||0.002).htmlElement(d=>d.el).htmlTransitionDuration(0);
G.controls().enableDamping=true;G.controls().dampingFactor=0.12;G.controls().rotateSpeed=0.5;G.controls().zoomSpeed=0.8;
try{const m=G.globeMaterial();m.shininess=8;}catch(e){}

// coastlines overlay: only near the ground, where the photo turns soft
const coastPaths=coast50.coordinates.filter(l=>l.length>1).map(l=>({c:dens(l).map(p=>[p[0],p[1],0.0006]),col:"rgba(30,50,60,.45)",w:0.3,kind:"coast"}));
const RIVERS=__RIVERS__;
const riverPaths=RIVERS.features.flatMap(f=>(f.geometry.type==="LineString"?[f.geometry.coordinates]:f.geometry.coordinates)).map(l=>({c:l.map(p=>[p[0],p[1],0.0007]),col:"rgba(30,110,200,.65)",w:0.4,kind:"river"}));

function sizeGlobe(){const b=el.getBoundingClientRect();G.width(b.width).height(b.height);}
const altFor=r=>r>=89?2.35:Math.max(0.035,Math.min(2.35,Math.tan(r*Math.PI/180)*1.55));
let alt=2.35;

// ---------- build layers for the current date ----------
const mk=(cls,txt)=>{const d=document.createElement("div");d.className=cls;if(txt!==undefined){const s=document.createElement("span");s.className="gl-label";s.textContent=txt;d.appendChild(s);}return d;};
const labelEls=new Map();function labelEl(key,txt,cls){if(!labelEls.has(key)){const d=document.createElement("div");d.className="gl-label "+(cls||"");d.textContent=txt;labelEls.set(key,d);}return labelEls.get(key);}
const evEls=new Map();function evEl(e){if(!evEls.has(e.label)){const d=mk("gl-ev"+(e.status==="inferred"?" inf":""));d.appendChild(document.createElement("i"));const s=document.createElement("span");s.className="gl-label";s.textContent=e.label+"  "+e.date;d.appendChild(s);evEls.set(e.label,d);}return evEls.get(e.label);}
const headEl=mk("gl-head");headEl.appendChild(document.createElement("i"));

function update(){
  const P=[];const W=alt<0.6?2.4:alt<1.2?1.9:1.7;
  const add=(coords,col,w,extra)=>{if(coords.length>1)P.push({c:coords,col,w,...extra});};
  // protest (not counted)
  const pr=D.protest.points;for(let i=1;i<pr.length;i++){const f=frac(pr[i-1].t,pr[i].t);if(f>0)add(partial([[pr[i-1].lon,pr[i-1].lat],[pr[i].lon,pr[i].lat]],f),COL.protest,W*0.5,{dash:[0.02,0.02]});}
  // voided leg
  const v=D.voided,vf=frac(v.lo,v.hi);
  if(vf>0){const g=T>=v.voided_on?voidFade:0,c=dens(partial(v.path,vf));add(c,COL.casing,W*2.4*(1-g*0.5));add(c,d3.interpolateRgb(ROUTE,COL.void)(g),W*(1.3-0.5*g));}
  // route, grouped into runs of the same style so each run is one smooth line
  let run=null,head=null;
  const flush=()=>{if(run){add(run.c,COL.casing,run.w*2.1);add(run.c,run.col,run.w*1.25);run=null;}};
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(b.leg==="start"){flush();continue;}const f=frac(b.dep,b.t);if(f<=0){flush();break;}
    const c=cut(LEG[i],f);if(f<1)head=c;
    const inf=a.status==="inferred"||b.status==="inferred",ep=epOf(b.t);
    const st=(b.leg==="swim"?"swim":b.leg==="gap"?"gap":inf?"soft":"walk");
    const col=b.leg==="swim"?COL.swim:b.leg==="gap"?hexA(ep.color,.35):inf?hexA(ep.color,.6):ep.color;
    const w=b.leg==="gap"?W*0.6:inf?W*0.85:W;
    if(run&&run.st===st)run.c=run.c.concat(c.slice(1));else{flush();run={st,c:c.slice(),col,w};}
    if(f<1){flush();break;}}
  flush();
  if(alt<0.9){P.push(...coastPaths);if(alt<0.5)P.push(...riverPaths);}
  G.pathsData(P);
  // transport arcs
  const A=[];D.moves.forEach(m=>{if(T<m.lo)return;if(!(activeCase==="all"||playing||m.case===activeCase))return;
    const col=(m.type==="back"||m.type==="fwd_rewalked")?COL.back:COL.move,dim=activeCase==="all"&&!playing;
    for(let i=1;i<m.path.length;i++)A.push({a:m.path[i-1],b:m.path[i],col:dim?col+"aa":col,w:alt<1.2?null:0.45});});
  G.arcsData(A);
  // html: head, events, labels
  const H=[];const fr=frontier();
  if(T<T1){headEl.className="gl-head"+(fr.moving?"":" wait");H.push({lat:fr.pos[1],lon:fr.pos[0],el:headEl,alt:0.004});}
  if(alt<1.3)D.events.forEach(e=>{if(T>=e.t)H.push({lat:e.lat,lon:e.lon,el:evEl(e),alt:0.003});});
  if(showLabels&&alt<0.9){const pov=G.pointOfView(),c=[pov.lng,pov.lat],lim=Math.min(0.9,alt*0.9);
    const evPos=D.events.filter(e=>T>=e.t).map(e=>[e.lon,e.lat]);
    for(let i=0;i<=fr.i;i++){const p=pts[i];if(d3.geoDistance([p.lon,p.lat],c)>lim)continue;if(evPos.some(q=>d3.geoDistance(q,[p.lon,p.lat])<0.0012))continue;H.push({lat:p.lat,lon:p.lon,el:labelEl("p"+i,alt<0.25?p.name+"  "+p.date:p.name,p.status==="inferred"?"inf":""),alt:0.002});}
    (CFG.refs[activeCase]||[]).forEach(r=>H.push({lat:r.lat,lon:r.lon,el:labelEl("r"+r.label,r.label,"ref"),alt:0.002}));}
  G.htmlElementsData(H);
  updateTicker(fr);
}

// ---------- ticker ----------
const tDate=document.getElementById("tDate"),tPlace=document.getElementById("tPlace"),tStall=document.getElementById("tStall"),scrub=document.getElementById("scrub");
function updateTicker(fr){
  tDate.textContent=fmt(Math.round(T));tPlace.textContent=fr.place||pts[fr.i].name;
  const mv=activeMove();let msg="",on=false;
  if(fr.moving)msg=fr.moving==="swim"?"游泳中":"行走中";
  else if(mv)msg="交通工具：线不动（"+(mv.type==="back"?"往后送":mv.type==="fwd_rewalked"?"往前押送，之后重走":"离线/归位")+"）";
  if(!fr.moving&&T<T1){const s=Math.floor(T-lastMoveEnd());if(s>=30){msg=(msg?msg+" · ":"")+"线已停 "+s.toLocaleString()+" 天";on=s>=180;}}
  tStall.textContent=msg;tStall.className="stall"+(on?" on":"");
  if(document.activeElement!==scrub)scrub.value=Math.round((T-T0)/(T1-T0)*1000);stripeNow();}

// ---------- rail: stats, groups, notes, legend ----------
const statsEl=document.getElementById("stats");(CFG.stats||[]).forEach(([v,l])=>{const d=document.createElement("div");d.className="stat";const b=document.createElement("b");b.textContent=v;const sp=document.createElement("span");sp.textContent=l;d.append(b,sp);statsEl.append(d);});
const groupsEl=document.getElementById("groups"),noteEl=document.getElementById("note");
function caseBtn(cs){const b=document.createElement("button");b.type="button";b.className="case";b.id="case-"+cs.id;b.setAttribute("aria-pressed","false");
  b.style.setProperty("--ep",ROUTE);
  const t=document.createElement("span");t.className="t";t.textContent=cs.title;b.append(t);b.onclick=()=>select(cs.id,true);return b;}
const g0=document.createElement("div");g0.className="group";CFG.cases.filter(c=>!c.episode).forEach(c=>g0.append(caseBtn(c)));groupsEl.append(g0);
EPS.forEach(ep=>{const g=document.createElement("div");g.className="group";g.style.marginTop="14px";
  const h=document.createElement("div");h.className="group-h";const chip=document.createElement("i");chip.className="chip";chip.style.background="var(--muted)";
  const b=document.createElement("b");b.textContent=ep.tag+"《"+ep.title+"》";const y=document.createElement("span");y.textContent=ep.years;h.append(chip,b,y);g.append(h);
  CFG.cases.filter(c=>c.episode===ep.id).forEach(c=>g.append(caseBtn(c)));groupsEl.append(g);});
function renderNote(cs){noteEl.innerHTML="";
  const l=document.createElement("div");l.className="label";l.textContent="对应分集节拍 "+cs.beats;const h=document.createElement("h2");h.textContent=cs.title;
  const p=document.createElement("p");p.textContent=cs.text;noteEl.append(l,h,p);
  const dl=document.createElement("dl");dl.className="tl";
  cs.facts.split("\n").filter(Boolean).forEach(line=>{let m=line.match(/^(约?\d[\d\-—/]*)\s+(.+)$/)||line.match(/^(\S+)\s{2,}(.+)$/);
    const dt=document.createElement("dt"),dd=document.createElement("dd");if(m){dt.textContent=m[1];dd.textContent=m[2];}else{dt.textContent="·";dd.textContent=line;}dl.append(dt,dd);});
  noteEl.append(dl);}
const legendEl=document.getElementById("legend");
[[`border-color:${ROUTE};border-top-width:4px`,"步行"],
 [`border-color:${COL.swim};border-top-width:4px`,"游泳（里海、英吉利海峡）"],
 [`border-color:${hexA(ROUTE,.6)};border-top-width:3px`,"颜色较淡：路线为推断"],
 [`border-color:${COL.move};border-top-style:dashed`,"交通工具：离地弧线，不推进路线"],
 [`border-color:${COL.back};border-top-style:dashed`,"往前押送（已重走）/ 往后送"],
 [`border-color:${COL.void}`,"作废段（被新线替换）"],
 [`border-color:#9aa3a0;border-top-style:dotted`,"抗议步行（不计入环球路线）"]].forEach(([st,tx])=>{const sw=document.createElement("span");sw.className="sw";sw.setAttribute("style",st);const t=document.createElement("span");t.textContent=tx;legendEl.append(sw,t);});

// ---------- the 28-year stripe ----------
const stripe=document.getElementById("stripe"),scv=document.getElementById("stripeCv"),snow=document.getElementById("stripeNow");
const moving=[];for(let i=1;i<pts.length;i++){const b=pts[i];if(b.leg!=="start")moving.push([b.dep,b.t]);}moving.push([D.voided.lo,D.voided.hi]);
function drawStripe(){const r=stripe.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);scv.width=r.width*dpr;scv.height=r.height*dpr;const c=scv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  const x=t=>(t-T0)/(T1-T0)*r.width,cs=getComputedStyle(document.documentElement);c.fillStyle=cs.getPropertyValue("--rule");c.fillRect(0,0,r.width,r.height);
  const months=Math.ceil((T1-T0)/30.44);for(let k=0;k<months;k++){const a=T0+k*30.44,b=a+30.44;const on=moving.some(([p,q])=>q>a&&p<b);if(!on)continue;
    c.fillStyle=ROUTE;c.fillRect(x(a),5,Math.max(1,x(b)-x(a)+0.3),r.height-10);}
  D.moves.forEach(m=>{c.fillStyle=(m.type==="back"||m.type==="fwd_rewalked")?COL.back:COL.move;c.fillRect(x(m.lo),0,Math.max(2,x(m.hi)-x(m.lo)),4);});}
const stripeKey=document.getElementById("stripeKey");
[["var(--rule)","停着（签证、资金、地缘政治）"],[COL.move,"顶部细条：交通工具"]].forEach(([c,t])=>{const s=document.createElement("span");const i=document.createElement("i");i.style.background=c;s.append(i,t);stripeKey.append(s);});
function stripeNow(){snow.style.left=`calc(${((T-T0)/(T1-T0)*100).toFixed(3)}% - 1px)`;}
const stripeSeek=ev=>{const r=stripe.getBoundingClientRect();pause();T=T0+Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*(T1-T0);update();};
stripe.addEventListener("pointerdown",ev=>{stripeSeek(ev);stripe.setPointerCapture(ev.pointerId);});stripe.addEventListener("pointermove",ev=>{if(ev.buttons)stripeSeek(ev);});
stripe.addEventListener("keydown",ev=>{if(ev.key==="ArrowRight"||ev.key==="ArrowLeft"){pause();T=Math.max(T0,Math.min(T1,T+(ev.key==="ArrowRight"?91:-91)));update();ev.preventDefault();}});
new ResizeObserver(drawStripe).observe(stripe);

const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function select(id,fly){activeCase=id;const cs=CFG.cases.find(c=>c.id===id);
  document.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",b.id==="case-"+id?"true":"false"));
  renderNote(cs);
  pause();spin(false);T=T1;alt=altFor(cs.radius);G.pointOfView({lat:cs.center[1],lng:cs.center[0],altitude:alt},fly&&!reduce()?2200:0);update();
  if(location.hash.slice(1)!==id){try{history.replaceState(null,"","#"+id);}catch(e){}}}

// ---------- playback ----------
const playBtn=document.getElementById("play"),speedBtn=document.getElementById("speed");
const BASE_MS=64000;let raf=null,last=0,acc=0;
function pause(){if(raf)cancelAnimationFrame(raf);raf=null;playing=false;playBtn.textContent="▶ 按日期播放";}
function play(){spin(false);if(T>=T1-1)T=T0;activeCase="all";document.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",b.id==="case-all"?"true":"false"));
  playing=true;playBtn.textContent="❚❚ 暂停";alt=1.7;last=performance.now();
  const step=now=>{const dt=now-last;last=now;T=Math.min(T1,T+dt/BASE_MS*speed*(T1-T0));acc+=dt;
    const fr=frontier(),pov=G.pointOfView(),k=Math.min(1,dt/800),c=d3.geoInterpolate([pov.lng,pov.lat],[fr.pos[0],Math.max(-45,Math.min(60,fr.pos[1]))])(k);
    G.pointOfView({lat:c[1],lng:c[0],altitude:pov.altitude+(alt-pov.altitude)*k},0);
    if(acc>45){acc=0;update();}
    if(T>=T1){update();pause();return;}raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);}
playBtn.onclick=()=>playing?pause():play();
speedBtn.onclick=()=>{speed=speed===1?2:speed===2?0.5:1;speedBtn.textContent=speed+"×";};
scrub.addEventListener("input",()=>{pause();T=T0+(+scrub.value/1000)*(T1-T0);update();});
function spin(on){const b=document.getElementById("spin");if(on===undefined)on=!G.controls().autoRotate;b.setAttribute("aria-pressed",on?"true":"false");G.controls().autoRotate=on;G.controls().autoRotateSpeed=0.45;}
document.getElementById("spin").onclick=()=>spin();
document.getElementById("labels").onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute("aria-pressed",showLabels);update();};
let vRaf=null;document.getElementById("voidfade").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);
  const from=voidFade,to=on?1:0,t0=performance.now();if(vRaf)cancelAnimationFrame(vRaf);
  const st=now=>{const t=reduce()?1:Math.min(1,(now-t0)/1400);voidFade=from+(to-from)*d3.easeCubicInOut(t);update();if(t<1)vRaf=requestAnimationFrame(st);};vRaf=requestAnimationFrame(st);};
// re-layer when the viewer zooms by hand
let lastAlt=alt;G.controls().addEventListener("change",()=>{const a=G.pointOfView().altitude;if(!playing&&Math.abs(Math.log(a/lastAlt))>0.25){alt=a;lastAlt=a;update();}});

// ---------- boot ----------
document.getElementById("hTitle").textContent=CFG.title;document.getElementById("hSub").textContent=CFG.subtitle;document.getElementById("foot").textContent=CFG.footnote;
sizeGlobe();window.addEventListener("resize",sizeGlobe);
const start=location.hash.slice(1);select(CFG.cases.some(c=>c.id===start)?start:"all",false);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(CFG.cases.some(c=>c.id===h)&&h!==activeCase)select(h,true);});
</script>
